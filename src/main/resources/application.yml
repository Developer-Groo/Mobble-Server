spring:
  application:
    name: Mobble-Server

  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${MYSQL_URL}
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: ${JWT_SECRET_KEY}

fcm:
  enabled: true
  project-id: ${FCM_PROJECT_ID}
  service-account: file:${FIREBASE_CREDENTIALS_PATH}
  dry-run: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: false
