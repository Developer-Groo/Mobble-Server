<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>추가 정보 입력</title>
</head>
<body>
<h1>추가 정보 입력</h1>
<p>소셜 로그인이 거의 완료되었습니다! 아래 정보를 추가로 입력해주세요.</p>

<!--
     action 속성은 최종 회원가입 API의 경로입니다.
     이전에 설정한 /api/v1/auth/signup 경로를 사용합니다.
   -->
<form action="/signup" method="post">
    <!-- 컨트롤러로부터 받은 정보는 hidden 필드로 유지합니다. -->
    <input type="hidden" id="email" name="email" th:value="${email}">
    <input type="hidden" id="name" name="name" th:value="${name}">
    <input type="hidden" id="socialProvider" name="socialProvider" th:value="${socialProvider}">
    <input type="hidden" id="socialId" name="socialId" th:value="${socialId}"> <!-- socialId 추가 -->

    <div>
        <label for="age">나이:</label>
        <input type="number" id="age" name="age" required>
    </div>
    <div>
        <label for="gender">성별:</label>
        <select id="gender" name="gender" required>
            <option value="MALE">남성</option>
            <option value="FEMALE">여성</option>
        </select>
    </div>
    <div>
        <label for="phone">전화번호:</label>
        <input type="text" id="phone" name="phone" required>
    </div>
    <div>
        <label for="ground">주 활동 지역:</label>
        <input type="text" id="ground" name="ground" required>
    </div>
    <div>
        <label for="profileImage">프로필 이미지 URL:</label>
        <input type="text" id="profileImage" name="profileImage">
    </div>
    <div>
        <label>
            <input type="checkbox" name="privacyAgreed" value="true" required>
            개인정보 수집에 동의합니다.
        </label>
    </div>
    <div>
        <label>
            <input type="checkbox" name="termsAgreed" value="true" required>
            이용 약관에 동의합니다.
        </label>
    </div>

    <button type="submit">가입 완료</button>
</form>
</body>
</html>
